<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="450" height="450">
  <!--
    Day Arc — both slots reconfigured by the user, 10:09.

    The point of this render is the left slot. "Design Review" is what a
    Next event provider can hand back, and it does not fit a 34-degree arc:

      arc length = 186 * (34 deg in rad) = 110px
      at 15px proportional + 1.3 tracking, about 11 characters

    ellipsis="TRUE" on TextCircular clips it rather than letting it run off
    the ends of the arc, which is what the single 84-degree bottom arc used
    to do. Shown here truncated exactly as the renderer would.

    The right slot is the SUNRISE_SUNSET system provider — real sunset time,
    reachable as a complication even though there is no sunrise/sunset token
    for expressions, so it cannot drive the sun's position.
  -->
  <defs>
    <clipPath id="disc"><circle cx="225" cy="225" r="225"/></clipPath>

    <linearGradient id="sky" gradientUnits="userSpaceOnUse"
                    x1="120.1" y1="26.0" x2="329.9" y2="424.0">
      <stop offset="0.00" stop-color="#FFF3D2"/>
      <stop offset="0.07" stop-color="#FFD79B"/>
      <stop offset="0.15" stop-color="#E5A57C"/>
      <stop offset="0.28" stop-color="#A8C0D6"/>
      <stop offset="0.48" stop-color="#5081B4"/>
      <stop offset="0.72" stop-color="#1F3D68"/>
      <stop offset="1.00" stop-color="#08152C"/>
    </linearGradient>

    <linearGradient id="earth" gradientUnits="userSpaceOnUse"
                    x1="225" y1="292" x2="225" y2="450">
      <stop offset="0.00" stop-color="#261E15"/>
      <stop offset="0.55" stop-color="#0F1017"/>
      <stop offset="1.00" stop-color="#070910"/>
    </linearGradient>

    <path id="comp-l" d="M86.78,349.46 A186,186 0 0 0 180.00,405.48"/>
    <path id="comp-r" d="M270.00,405.48 A186,186 0 0 0 363.22,349.46"/>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="450" height="450" fill="url(#sky)"/>

    <path d="M52,225 A173,173 0 0 1 398,225" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"
          stroke-dasharray="3 9" stroke-linecap="round"/>

    <circle cx="144.3" cy="72.0" r="62" fill="#FFD08A" fill-opacity="0.118"/>
    <circle cx="144.3" cy="72.0" r="44" fill="#FFD89B" fill-opacity="0.188"/>
    <circle cx="144.3" cy="72.0" r="30" fill="#FFE3B4" fill-opacity="0.302"/>
    <circle cx="144.3" cy="72.0" r="19" fill="#FFF4D2"/>

    <text x="225" y="205" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="70" font-weight="300" letter-spacing="-2" fill="#FFFFFF">10:09</text>
    <text x="225" y="248" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="14" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.62">TUE 12 AUG</text>

    <ellipse cx="225" cy="1019" rx="600" ry="727" fill="url(#earth)"/>
    <ellipse cx="225" cy="1019" rx="600" ry="727" fill="none"
             stroke="#FFD9A0" stroke-opacity="0.55" stroke-width="2"/>

    <!-- left: Next event, clipped by ellipsis rather than overrunning -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="15" letter-spacing="1.3" fill="#8A93A0">
      <textPath href="#comp-l" startOffset="50%" text-anchor="middle">Design Rev…</textPath>
    </text>
    <!-- right: Sunrise/sunset system provider -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="15" letter-spacing="1.3" fill="#8A93A0">
      <textPath href="#comp-r" startOffset="50%" text-anchor="middle">20:14</textPath>
    </text>
    <circle cx="225" cy="411" r="3" fill="#6E7783"/>
  </g>
</svg>
